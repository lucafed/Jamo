<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Jamo — Trova la meta perfetta</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0A0F14">

  <link rel="stylesheet" href="/style.css?v=6.1" />

  <!-- 🎨 ACCENT COLORS -->
  <style>
    :root{
      --bg:#0A0F14;
      --card:#141C22;
      --text:#ffffff;
      --muted:#A0B2BA;

      --blue:#38BDF8;
      --green:#34D399;
      --violet:#A855F7;
      --amber:#F59E0B;

      --grad-main:linear-gradient(135deg,#6366F1,#22D3EE);
    }

    body{background:var(--bg);color:var(--text)}

    .chip.active{font-weight:700}

    /* TEMPO */
    #timeChips .chip.active{
      background:#0B3B52;
      border-color:var(--blue);
      color:#BAE6FD;
    }

    /* CATEGORIE */
    #categoryChips .chip.active{
      background:#052E1B;
      border-color:var(--green);
      color:#A7F3D0;
    }

    /* MAI FATTO */
    #categoryChips .chip[data-cat="eventi"].active,
    #eventTypeChips .chip.active{
      background:#2E1065;
      border-color:var(--violet);
      color:#E9D5FF;
    }

    /* CTA */
    .btnPrimary{
      background:var(--grad-main);
      border:none;
      color:#fff;
      font-weight:800;
    }
  </style>
</head>

<body>

<header class="topbar clickSafe">
  <div class="brand">
    <div class="logoMark">J</div>
    <div>
      <div class="brandTitle">Jamo</div>
      <div class="brandSub">Offline-first • UX guidata</div>
    </div>
  </div>
</header>

<main class="wrap">

<!-- PARTENZA -->
<section id="quickStartCard" class="card clickSafe">
  <div class="cardTitle">📍 Partenza</div>

  <input id="originLabel" class="input" placeholder="Es: Bussolengo, Verona…" />
  <button id="btnFindPlace" class="btn btnPrimary">Usa questo luogo</button>

  <input id="originLat" type="hidden" />
  <input id="originLon" type="hidden" />
</section>

<!-- RICERCA -->
<section id="searchCard" class="card clickSafe">

  <!-- TEMPO -->
  <div class="subTitle">⏱️ Quanto tempo hai?</div>
  <div id="timeChips" class="chips">
    <div class="chip" data-min="60">1h</div>
    <div class="chip active" data-min="90">1h 30</div>
    <div class="chip" data-min="120">2h</div>
    <div class="chip" data-min="180">3h</div>
  </div>

  <!-- CATEGORIE -->
  <div class="subTitle">🧭 Che vibe vuoi?</div>
  <div id="categoryChips" class="chips chipsGrid">
    <div class="chip active" data-cat="natura">🌿 Natura</div>
    <div class="chip" data-cat="borghi">🏘️ Borghi</div>
    <div class="chip" data-cat="relax">🧖 Relax</div>
    <div class="chip" data-cat="family">👨‍👩‍👧‍👦 Family</div>
    <div class="chip" data-cat="eventi">✨ Mai fatto</div>
  </div>

  <!-- MAI FATTO -->
  <div id="eventsSubfilters" class="eventsSubfilters">
    <div class="subTitleMini">Tipo WOW</div>
    <div id="eventTypeChips" class="chips">
      <div class="chip active" data-etype="tutti">⭐ Tutti</div>
      <div class="chip" data-etype="relax">🧠 Reset</div>
      <div class="chip" data-etype="famiglia">👨‍👩‍👧‍👦 Family</div>
      <div class="chip" data-etype="tramonto">🌅 Tramonto</div>
    </div>
  </div>

  <button id="btnFind" class="btn btnPrimary btnBig">🚀 CERCA</button>
</section>

<!-- RISULTATO -->
<section id="resultCard" class="card clickSafe">
  <div class="cardTitle">📌 Risultato</div>
  <div id="resultArea">
    <div class="emptyState">Pronto quando lo sei tu.</div>
  </div>
</section>

</main>

<script src="/events.js?v=1.0"></script>
<script src="/app.js?v=22.2"></script>

<!-- 🧭 UX GUIDATA -->
<script>
(() => {
  const go = id =>
    document.getElementById(id)?.scrollIntoView({behavior:"smooth",block:"start"});

  btnFindPlace.onclick = () => setTimeout(()=>go("timeChips"),200);

  document.querySelectorAll("#timeChips .chip")
    .forEach(c=>c.onclick=()=>setTimeout(()=>go("categoryChips"),150));

  document.querySelectorAll("#categoryChips .chip")
    .forEach(c=>c.onclick=()=>setTimeout(()=>{
      c.dataset.cat==="eventi"?go("eventsSubfilters"):go("btnFind");
    },150));

  document.querySelectorAll("#eventTypeChips .chip")
    .forEach(c=>c.onclick=()=>setTimeout(()=>go("btnFind"),120));

  btnFind.onclick = () => setTimeout(()=>go("resultCard"),300);
})();
</script>

</body>
</html>
