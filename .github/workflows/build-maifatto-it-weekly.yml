name: Build MaiFatto Abruzzo (weekly)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1" # lunedì 03:00 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "no lock"; fi

      - name: Build dataset (Abruzzo)
        env:
          OVERPASS_ENDPOINT: https://overpass-api.de/api/interpreter
          SLEEP_MS: "1800"
          GRID_COLS: "5"
          GRID_ROWS: "5"
          TARGET_IDEAS: "2500"
        run: |
          node scripts/build_maifatto_it_abruzzo.mjs
          ls -lah public/data/mai_fatto || true
          ls -lah public/data/mai_fatto/mai_fatto_it_abruzzo.json || true

      - name: Commit & push if changed
        run: |
          git config user.name "jamo-bot"
          git config user.email "jamo-bot@users.noreply.github.com"
          git add public/data/mai_fatto/mai_fatto_it_abruzzo.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(data): weekly refresh mai_fatto_it_abruzzo"
          git push
