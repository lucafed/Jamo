name: Events — Daily (Verona)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build events
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run build:events

      - name: Show stats
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          console.log("events_all.json:", {
            updated_at: j.updated_at,
            count: j.count,
            days_ahead: j.days_ahead,
            stats: j.stats
          });
          NODE

      - name: Commit & push (events only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events/events_all.json cache/geocode-cache.json events_sources.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(events): daily update"
          git push
