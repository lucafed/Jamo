name: Build MaiFatto IT Abruzzo

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_maifatto_it_abruzzo.mjs"
      - ".github/workflows/build-maifatto-it-abruzzo.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Abruzzo dataset
        env:
          OVERPASS_ENDPOINT: ${{ secrets.OVERPASS_ENDPOINT }}
          SLEEP_MS: "1400"
          GRID_COLS: "5"
          GRID_ROWS: "5"
          TARGET_IDEAS: "2600"
          MAX_TILES: ""
        run: node scripts/build_maifatto_it_abruzzo.mjs

      - name: Commit generated file (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/mai_fatto/mai_fatto_it_abruzzo.json
          git commit -m "Update MaiFatto Abruzzo" || echo "No changes"
          git push
