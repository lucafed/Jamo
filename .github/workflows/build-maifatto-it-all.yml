name: Build MaiFatto IT (weekly)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 1" # lunedì 03:00 UTC

permissions:
  contents: write

concurrency:
  group: build-maifatto-it
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (if any)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "no lock"; fi

      - name: Ensure output folder exists
        run: |
          mkdir -p public/data/mai_fatto
          ls -lah public/data/mai_fatto || true

      - name: Build dataset (Italy)
        env:
          OVERPASS_ENDPOINT: https://overpass-api.de/api/interpreter
          SLEEP_MS: "1200"
          # Se vuoi testare veloce la prima volta:
          # MAX_TILES: "6"
        run: |
          node scripts/build_maifatto_it_all.mjs
          echo "---- OUTPUT FILES ----"
          ls -lah public/data/mai_fatto || true
          echo "---- HEAD JSON ----"
          head -n 30 public/data/mai_fatto/mai_fatto_it_all.json || true

      - name: Commit & push if changed
        run: |
          git config user.name "jamo-bot"
          git config user.email "jamo-bot@users.noreply.github.com"
          git add public/data/mai_fatto/mai_fatto_it_all.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(data): weekly refresh mai_fatto_it_all"
          git push
