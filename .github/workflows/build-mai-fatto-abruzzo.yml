name: Build MaiFatto IT Abruzzo

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_maifatto_it_abruzzo.mjs"
      - ".github/workflows/build-maifatto-it-abruzzo.yml"

permissions:
  contents: write

concurrency:
  group: maifatto-abruzzo-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Abruzzo dataset
        env:
          OVERPASS_ENDPOINT: ${{ secrets.OVERPASS_ENDPOINT }}
          SLEEP_MS: "1400"
          GRID_COLS: "5"
          GRID_ROWS: "5"
          TARGET_IDEAS: "2600"
          # lascia vuoto per "tutte le tile"
          MAX_TILES: ""
        run: node scripts/build_maifatto_it_abruzzo.mjs

      - name: Commit & Push (safe rebase)
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/mai_fatto/mai_fatto_it_abruzzo.json

          # Se non ci sono differenze, esci pulito
          git diff --cached --quiet && echo "No changes" && exit 0

          git commit -m "Update MaiFatto Abruzzo"

          # Allinea al remote (evita 'fetch first')
          git pull --rebase origin main

          # Push
          git push origin HEAD:main
