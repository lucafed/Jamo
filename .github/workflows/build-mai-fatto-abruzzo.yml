name: Build Mai Fatto — Abruzzo (verona-style)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # ogni giorno 03:17 UTC (regola se vuoi)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Abruzzo dataset
        env:
          OVERPASS_ENDPOINT: ${{ secrets.OVERPASS_ENDPOINT }}
          GRID_COLS: "5"
          GRID_ROWS: "5"
          SLEEP_MS: "900"
          TARGET_TOTAL: "1200"
          PER_MODE_MIN: "70"
        run: |
          node scripts/build_maifatto_it_abruzzo_like_verona.mjs

      - name: Commit generated file (if changed)
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/data/mai_fatto/mai_fatto_it_abruzzo.json
            git commit -m "chore(data): update mai_fatto Abruzzo (verona-style)"
            git push
          else
            echo "No changes"
          fi
