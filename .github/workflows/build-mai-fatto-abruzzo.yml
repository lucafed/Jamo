name: Build MaiFatto IT Abruzzo

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_maifatto_it_abruzzo.mjs"
      - ".github/workflows/build-maifatto-it-abruzzo.yml"

concurrency:
  group: build-maifatto-it-abruzzo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (full history for rebase)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Abruzzo dataset
        env:
          OVERPASS_ENDPOINT: ${{ secrets.OVERPASS_ENDPOINT }}
          SLEEP_MS: "1400"
          GRID_COLS: "5"
          GRID_ROWS: "5"
          TARGET_IDEAS: "2600"
          MAX_TILES: ""
        run: node scripts/build_maifatto_it_abruzzo.mjs

      - name: Commit & Push generated file (robust)
        shell: bash
        run: |
          set -euo pipefail

          FILE="public/data/mai_fatto/mai_fatto_it_abruzzo.json"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # assicurati di stare su main e di avere origin/main aggiornato
          git checkout main
          git fetch origin main

          # stage
          git add "$FILE" || true

          # se non ci sono differenze, stop
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MaiFatto Abruzzo"

          # rebase su origin/main prima di pushare (evita fetch-first)
          git pull --rebase origin main

          # push con retry (in caso di gara con altri push)
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt $i). Re-trying after rebase..."
            git fetch origin main
            git pull --rebase origin main
            sleep $((i*2))
          done

          echo "Push failed after retries."
          exit 1
