name: Build Events (daily)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # ▶️ BUILD EVENTI
      - name: Build events
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run build:events

      # 🛑 GUARD: evita commit se vuoto
      - name: Guard empty dataset
        run: |
          node -e "
          const fs = require('fs');
          const p = 'public/data/events/events_all.json';
          if (!fs.existsSync(p)) {
            console.error('❌ events_all.json missing');
            process.exit(1);
          }
          const j = JSON.parse(fs.readFileSync(p,'utf8'));
          console.log('events_all:', j.updated_at, 'count=', j.count);
          if (!j.count || j.count === 0) {
            console.error('❌ count=0 → stop');
            process.exit(1);
          }
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events/events_all.json cache/geocode-cache.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(events): daily update"
          git push
