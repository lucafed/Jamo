name: Build Events Dataset

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # 🔴 QUI È IL PUNTO CRITICO
      # Node esegue SOLO un file .mjs
      - name: Build events dataset
        env:
          JAMO_UA: "JamoEventsBot/1.0"
        run: |
          node scripts/build_events_all.mjs

      # 🛡️ non rompere mai l’app se dataset vuoto
      - name: Guard empty dataset
        run: |
          if [ ! -s public/data/events/events_all.json ]; then
            echo '{"updated_at":null,"count":0,"events":[]}' > public/data/events/events_all.json
          fi

      - name: Commit & push events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events/events_all.json || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(events): update events dataset"
          git pull --ff-only origin main
          git push origin HEAD:main
