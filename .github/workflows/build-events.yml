name: Build Events Dataset

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build events dataset
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run build:events

      - name: Guard empty dataset
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          if (!Number(j.count || 0)) process.exit(1);
          NODE

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events/events_all.json cache/geocode-cache.json || true
          git diff --cached --quiet || git commit -m "chore(events): daily update"
          git push
