name: Build Events (daily)

on:
  workflow_dispatch:
  schedule:
    # 03:15 UTC = 04:15 in Italia (in inverno). Se vuoi un altro orario dimmelo dopo.
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build events
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          # Se un domani attivi provider con API key, le metti qui come secrets:
          # TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          # OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
          # OA_ENDPOINT: ${{ secrets.OA_ENDPOINT }}
        run: npm run build:events

      - name: Show result stats
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          console.log("events_all.json stats:", {
            updated_at: j.updated_at,
            count: j.count,
            days_ahead: j.days_ahead
          });
          NODE

      - name: Commit & push (events only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ✅ SOLO file eventi + geocache
          git add public/data/events/events_all.json cache/geocode-cache.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(events): daily update"
          git push
