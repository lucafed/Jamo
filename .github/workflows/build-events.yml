name: Build Events (daily)

on:
  workflow_dispatch: {}
  schedule:
    # 03:15 UTC = 04:15 Italia inverno (05:15 estate)
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # 1) genera sorgenti (se lo usi)
      - name: Generate events sources (IT+EU)
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: node scripts/generate_events_sources.mjs

      # 2) build eventi (SCRIVE public/data/events/events_all.json)
      - name: Build events
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: npm run build:events

      - name: Show result stats
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          console.log("events_all.json stats:", {
            updated_at: j.updated_at,
            count: j.count,
            days_ahead: j.days_ahead,
            sources_total: j.stats?.sources_total,
            sources_ok: j.stats?.sources_ok,
            sources_fail: j.stats?.sources_fail
          });
          console.log("events_sources.generated.json exists:", fs.existsSync("events_sources.generated.json"));
          NODE

      - name: Commit & push (events only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            events_sources.generated.json \
            public/data/events/events_all.json \
            cache/geocode-cache.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(events): daily update"
          git push
