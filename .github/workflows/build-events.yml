name: Build Events Dataset

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Build events
        env:
          JAMO_UA: "JamoEventsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          JAMO_EVENTS_CONFIG: "configs/events.config.json"
        run: npm run build:events

      - name: Guard: do not commit empty dataset
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          const count = Number(j.count || 0);
          console.log("events_all.json:", { updated_at: j.updated_at, count });
          if (!count) {
            console.error("❌ Guard triggered: count=0. Not committing empty dataset.");
            process.exit(1);
          }
          NODE

      - name: Commit & push (events only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events/events_all.json cache/geocode-cache.json configs/events.config.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(events): update"
          git push
