name: Build Events Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-events
  cancel-in-progress: true

jobs:
  build-events:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (none)
        run: |
          echo "No dependencies to install"

      - name: Build events dataset
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          node scripts/build_events_all.mjs

      - name: Guard – prevent empty dataset
        run: |
          node - <<'NODE'
          import fs from "fs";
          const p = "public/data/events/events_all.json";
          if (!fs.existsSync(p)) {
            console.error("❌ events_all.json not found");
            process.exit(1);
          }
          const j = JSON.parse(fs.readFileSync(p, "utf8"));
          const count = Number(j.count || 0);
          console.log("events_all.json count =", count);
          if (!count) {
            console.error("❌ Dataset is empty, aborting commit");
            process.exit(1);
          }
          NODE

      - name: Commit & push dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/events/events_all.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(events): rebuild events dataset"
          git push
