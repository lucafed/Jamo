name: Build Events Dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  build-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build events dataset
        run: npm run build:events

      - name: Guard – prevent empty dataset
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('public/data/events/events_all.json','utf8'));if(!j.count||j.count===0){console.error('EMPTY EVENTS');process.exit(1)}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/events/events_all.json
          git commit -m "chore(events): update events dataset" || exit 0
          git push
