name: Build Italy Regions Datasets

on:
  workflow_dispatch: {}
  schedule:
    - cron: "10 2 * * *"

permissions:
  contents: write

concurrency:
  group: jamo-it-regions
  cancel-in-progress: true

jobs:
  build-it-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # 🧹 pulizia sicura output
      - name: Clean generated outputs
        run: |
          rm -rf public/data/pois/regions || true
          mkdir -p public/data/pois/regions

      # 🇮🇹 BUILD ITALIA — usa i TUOI script reali
      - name: Build IT regions datasets
        env:
          JAMO_UA: "JamoDatasetsBot/1.0"
        run: |
          node scripts/build_pois_it_region_all.yml
          node scripts/build-places-index.yml

      # ✅ commit SENZA rebase (zero conflitti)
      - name: Commit & push (ff-only)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/pois/regions public/data/places || true

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(data): update italy regions datasets"

          git fetch origin main
          git pull --ff-only origin main
          git push origin HEAD:main
