name: Build Italy Regions Datasets

on:
  workflow_dispatch: {}
  # opzionale: ogni notte
  schedule:
    - cron: "10 2 * * *"
  # opzionale: quando tocchi scripts o config
  push:
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "public/data/**"
      - ".github/workflows/build-it-regions.yml"

permissions:
  contents: write

concurrency:
  group: jamo-it-regions
  cancel-in-progress: true

jobs:
  build-it-regions:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # ✅ (consigliato) pulisce SOLO output generati per evitare roba “vecchia”
      - name: Clean generated outputs (safe)
        run: |
          # Se questi path sono diversi nel tuo repo, cambiali qui:
          rm -rf public/data/pois/regions || true
          mkdir -p public/data/pois/regions

      - name: Build IT regions datasets
        env:
          JAMO_UA: "JamoDatasetsBot/1.0 (github-actions)"
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        run: |
          npm run build:region:core
          npm run build:region:category
          npm run build:regions:index

      # ✅ Commit & push SENZA rebase (mai più conflitti automatici)
      - name: Commit & push (ff-only, no rebase)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Aggiungi qui SOLO i file generati da questa pipeline
          git add public/data/pois/regions || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore(data): update italy regions datasets"

          # 🔒 Importantissimo: niente rebase.
          # Se origin/main è avanzato, fallisce qui (niente conflitti)
          git fetch origin main
          git pull --ff-only origin main

          git push origin HEAD:main
